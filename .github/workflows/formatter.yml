name: formatter

on:
  - push

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chapter3/1_formatter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint:ci
